[package]
name = "kelpied"
version.workspace = true
edition.workspace = true
# What the code already needs (`is_none_or`, `LazyLock`). Starting a batch file with arguments is only safe from
# 1.77.2 on (the std library quotes them for cmd.exe), which this satisfies.
rust-version = "1.82"

[dependencies]
kelpie-proto = { path = "../kelpie-proto" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
interprocess.workspace = true
portable-pty.workspace = true
alacritty_terminal.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
uuid.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Mobile companion (LAN web app). TLS uses the ring provider only: aws-lc needs NASM.
axum = { version = "0.8", features = ["ws"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
regex = "1"
# SSH passwords / key passphrases saved by the app, read when ssh asks (askpass.rs).
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }
if-addrs = "0.15"
# Off-machine notifications (notify.rs): ntfy, Telegram and webhook posts. The same client and TLS
# provider (ring) as the app's usage meters.
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The processes of a session on macOS and Linux: names, memory, CPU, parents (procs.rs; Windows reads its own
# table). The same build as the memory meter of the app.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_WindowsProgramming", "Wdk_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: the freedesktop Secret Service (GNOME Keyring, KWallet) over D-Bus, as in kelpie-proto.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
