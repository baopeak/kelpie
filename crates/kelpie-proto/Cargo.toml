[package]
name = "kelpie-proto"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
interprocess.workspace = true
regex = "1"
fs2 = "0.4"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }

# Linux: the freedesktop Secret Service (GNOME Keyring, KWallet) over D-Bus. Without one running, saving a
# secret fails with an error that says so; nothing is ever kept in plain text or in memory instead.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
