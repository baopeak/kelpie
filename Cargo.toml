[workspace]
resolver = "2"
members = ["crates/kelpie-proto", "crates/kelpied", "crates/kelpie-stt", "app/src-tauri"]
# The speech helper downloads and links a large native library: built on request
# (`cargo build --release -p kelpie-stt`, scripts/build-release.sh), not by every `cargo build`.
default-members = ["crates/kelpie-proto", "crates/kelpied", "app/src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "fs"] }
interprocess = { version = "2.4", features = ["tokio"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
