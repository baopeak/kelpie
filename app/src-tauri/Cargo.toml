[package]
name = "kelpie"
version.workspace = true
edition.workspace = true
description = "Kelpie - multi-project agent workbench"

[lib]
name = "kelpie_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
kelpie-proto = { path = "../../crates/kelpie-proto" }
tauri = { version = "2.12", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
interprocess.workspace = true
parking_lot.workspace = true
tracing.workspace = true
base64.workspace = true
ignore = "0.4"
nucleo-matcher = "0.3"
notify = "8"
regex = "1"
trash = "5"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
zstd = "0.14.3"
# Markdown structure of exported messages (session_export.rs): parsing only, no HTML output.
pulldown-cmark = { version = "=0.13.5", default-features = false }
toml_edit = "0.25"
jsonc-parser = { version = "0.34", default-features = false, features = ["cst", "serde_json"] }


[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's own (browser pane screenshots through the WebView2 DevTools protocol).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: the freedesktop Secret Service (GNOME Keyring, KWallet) over D-Bus, as in kelpie-proto.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[features]
# Test-only: lets the end-to-end tests point the updater at a local server and skip the
# installer. Release builds never enable it (the release workflow checks).
e2e-updater = []
