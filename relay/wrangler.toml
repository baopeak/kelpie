# The router: checks the ticket and hands the socket to the room, and makes rooms (see src/worker.ts for who may). Holds no
# state of its own. The room and Registrar classes live in their own script (wrangler.room.toml), so deploy that one first: a
# router deploy then leaves live rooms alone.
name = "kelpie-link-relay"
main = "src/entry-router.ts"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

[observability]
enabled = false

# The phone app, served from this origin as static files: `public/` is the hosted bundle, copied in before a deploy and never
# committed. Static requests never run the Worker, an unknown path gets the bundle's 404.html without it, and the bundle's
# `_headers` sets each file's headers. Only `/v1/*` reaches the Worker.
[assets]
directory = "./public"
run_worker_first = ["/v1/*"]
not_found_handling = "404-page"

# Rooms for anyone while no REGISTRATION_KEY is set; setting that secret closes registration again, without a deploy. The limits
# count rooms made without a key per UTC day: per network, and in all.
[vars]
OPEN_REGISTRATION = "1"
ROOMS_PER_NETWORK_DAY = "20"
ROOMS_PER_DAY = "1000"

# A first, approximate shed of room making: 5 a minute per network, per Cloudflare location. The Registrar is the real cap.
[[ratelimits]]
name = "ROOM_RATE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
script_name = "kelpie-link-relay-room"

[[durable_objects.bindings]]
name = "REGISTRAR"
class_name = "Registrar"
script_name = "kelpie-link-relay-room"

# TICKET_SECRET and REGISTRATION_KEY come from `wrangler secret put`, never from this file.
