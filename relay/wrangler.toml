# The router: checks the ticket and hands the socket to the room. Holds no state of its own.
# The room class lives in its own script (wrangler.room.toml), so deploy that one first.
name = "kelpie-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
script_name = "kelpie-relay-room"

# TICKET_SECRET comes from `wrangler secret put TICKET_SECRET`, never from this file.
