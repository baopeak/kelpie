# The router: checks the ticket and hands the socket to the room, and makes rooms (see src/worker.ts for who may). Holds no
# state of its own. The room and Registrar classes live in their own script (wrangler.room.toml), so deploy that one first: a
# router deploy then leaves live rooms alone.
name = "kelpie-link-relay"
main = "src/entry-router.ts"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

[observability]
enabled = false

# The phone app, served from this origin as static files: `public/` is the hosted bundle, copied in before a deploy and never
# committed. Static requests never run the Worker, an unknown path gets the bundle's 404.html without it, and the bundle's
# `_headers` sets each file's headers. Only `/v1/*` reaches the Worker.
[assets]
directory = "./public"
run_worker_first = ["/v1/*"]
not_found_handling = "404-page"

# Rooms for anyone while no REGISTRATION_KEY is set; setting that secret closes registration again, without a deploy. The limits
# count rooms made without a key per UTC day: per network, and in all.
[vars]
OPEN_REGISTRATION = "1"
ROOMS_PER_NETWORK_DAY = "20"
ROOMS_PER_DAY = "1000"

# A first, approximate shed of room making: 5 a minute per network, per Cloudflare location. The Registrar is the real cap.
[[ratelimits]]
name = "ROOM_RATE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
script_name = "kelpie-link-relay-room"

[[durable_objects.bindings]]
name = "REGISTRAR"
class_name = "Registrar"
script_name = "kelpie-link-relay-room"

# TICKET_SECRET and REGISTRATION_KEY come from `wrangler secret put`, never from this file, as do the TURN secrets: TURN_KEY_ID and
# TURN_API_TOKEN (a Cloudflare Realtime TURN key: the relay then mints short-lived credentials for its rooms' screens), or TURN_SECRET
# and TURN_URLS for a coturn server. With neither, `/v1/turn` answers 404 `turn_not_configured`. Vars: TURN_MINTS_PER_DAY (500) and
# TURN_MINTS_PER_NETWORK_DAY (20) cap the credentials minted in a UTC day; TURN_OPEN_ROOMS = "1" gives rooms made without a registration
# key TURN too, which on this open relay means accepting what strangers' TURN traffic may cost (set a Cloudflare usage notification first).

# Staging (`--env staging`): the same router, assets and limits under its own name and origin, bound to the staging room script.
# Bindings and vars are not inherited by an environment, so they are repeated here. Its TICKET_SECRET is its own
# (`wrangler secret put TICKET_SECRET --env staging`), and its rate limit counts apart from production's.
[env.staging]
name = "kelpie-link-relay-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
OPEN_REGISTRATION = "1"
ROOMS_PER_NETWORK_DAY = "20"
ROOMS_PER_DAY = "1000"

[[env.staging.ratelimits]]
name = "ROOM_RATE"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
script_name = "kelpie-link-relay-room-staging"

[[env.staging.durable_objects.bindings]]
name = "REGISTRAR"
class_name = "Registrar"
script_name = "kelpie-link-relay-room-staging"
