# Only for bundling the self-hosted relay (`pnpm build:selfhost`): nothing is deployed from here.
name = "kelpie-link-relay-selfhost"
main = "entry.ts"
compatibility_date = "2026-10-15"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "REGISTRAR"
class_name = "Registrar"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registrar"]
