name: release

# Push a tag `v<version>` (the version in Cargo.toml, app/package.json and tauri.conf.json) to
# build signed installers and the updater manifest into a DRAFT release: check its files, then
# publish it on GitHub — only then does `releases/latest/download/latest.json` offer it to apps.
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty when the key
# has none).
#
# The same tag builds the hosted phone app twice (the two must hash alike), adds its manifest, bundle
# and hash to the draft, then deploys it with the relay's router: to staging, then to production,
# each only after the owner approves it in its GitHub environment (hosted-staging, hosted-production).
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are secrets of those environments only. Publish the
# draft only after the production deploy and its check passed. The room script deploys on its own
# (relay.yml, deploy-room), before this, and only when room code changed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing (the first Linux release, say) must not cancel the others' builds of the tag.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ""
          # One universal macOS build for Apple Silicon and Intel.
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
          # Built on the oldest supported Ubuntu, so the AppImage runs on newer glibc too.
          - os: ubuntu-22.04
            bundles: appimage,deb
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf \
            libasound2-dev xdg-utils libfuse2 file
      - name: The tag names the version every manifest declares
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          pkg=$(python3 -c "import json;print(json.load(open('app/package.json'))['version'])")
          conf=$(python3 -c "import json;print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          for v in "$cargo" "$pkg" "$conf"; do
            [ "$v" = "$tag" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $cargo, package.json $pkg, tauri.conf.json $conf"; exit 1; }
          done
      # Dependencies install in a step without the signing key. The next step has it in its environment;
      # scripts/build-release.sh removes it from what it passes on, so the sidecar builds and its own
      # `pnpm install` do not inherit it, and hands it only to `pnpm tauri build`, which builds the frontend,
      # bundles and signs. Known exposures: any same-user process of that step can still read the step shell's
      # starting environment (/proc/<pid>/environ); and during `tauri build` Tauri's AppImage bundler downloads
      # linuxdeploy and its GTK plugin (unpinned, Tauri's own choice) and runs them. Signing in a separate step,
      # with no key in the build's environment at all, is the real fix.
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build signed bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KELPIE_KEEP_VERSION: "1"
          KELPIE_REQUIRE_PHONE: "1"
          KELPIE_TARGET: ${{ matrix.target }}
          # linuxdeploy is itself an AppImage: run it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/build-release.sh --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.json
      - name: The release build carries no updater test hooks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin=target/release/kelpie.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            bin=target/universal-apple-darwin/release/kelpie
          else
            bin=target/release/kelpie
          fi
          [ -f "$bin" ] || { echo "app binary not found: $bin"; exit 1; }
          if grep -a -q KELPIE_UPDATE_ENDPOINT "$bin"; then echo "$bin was built with e2e-updater"; exit 1; fi
      # The relay test hooks (KELPIE_RELAY_TEST_URL, KELPIE_RELAY_TEST_CA) exist only in debug builds.
      - name: The release daemon carries the phone client, not its placeholder page, and no relay test hooks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bins="target/release/kelpied.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            bins="target/aarch64-apple-darwin/release/kelpied target/x86_64-apple-darwin/release/kelpied"
          else
            bins="target/release/kelpied"
          fi
          for bin in $bins; do
            [ -f "$bin" ] || { echo "daemon binary not found: $bin"; exit 1; }
            if grep -a -q KELPIE_PHONE_BUNDLE_MISSING "$bin"; then echo "$bin was built without the phone client"; exit 1; fi
            if grep -a -q -e KELPIE_RELAY_TEST_URL -e KELPIE_RELAY_TEST_CA "$bin"; then echo "$bin carries the relay test hooks"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
          if-no-files-found: error

  # The hosted phone app, built twice from clean folders: both builds must give one bundle hash.
  hosted-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      bundle_sha256: ${{ steps.build.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: The tag names the frontend's version
        shell: bash
        run: |
          pkg=$(python3 -c "import json;print(json.load(open('app/package.json'))['version'])")
          [ "$pkg" = "${GITHUB_REF_NAME#v}" ] || { echo "tag $GITHUB_REF_NAME, package.json $pkg"; exit 1; }
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build twice, write the manifests, compare
        id: build
        shell: bash
        env:
          KELPIE_HOSTED_ORIGIN: https://kelpie-link-relay.baopeak.workers.dev
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hosted"
          for n in 1 2; do
            rm -rf app/dist-phone-hosted
            (cd app && pnpm build:phone:hosted)
            mkdir -p "$out/$n"
            mv app/dist-phone-hosted "$out/$n/dist-phone-hosted"
            python3 -I scripts/hosted/bundle_manifest.py "$out/$n/dist-phone-hosted" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
          done
          cmp "$out/1/hosted-phone-manifest.json" "$out/2/hosted-phone-manifest.json"
          sha=$(python3 -I -c 'import json,sys;print(json.load(open(sys.argv[1]))["bundle_sha256"])' "$out/1/hosted-phone-manifest.json")
          echo "bundle_sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-phone
          path: ${{ runner.temp }}/hosted/1/
          if-no-files-found: error

  publish:
    needs: [build, hosted-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Installers only: the hosted app's files must never become release assets one by one.
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: bundle-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: hosted-phone
          path: hosted
      - name: Release files, notes and updater manifest
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Artifacts keep their bundle/nsis, macos, dmg folders: release assets are flat.
          mkdir -p dist
          find downloaded -type f -exec cp {} dist/ \;
          ls -l dist
          # Checkout may materialize the event tag as a lightweight commit ref.
          # Fetch its actual object into a separate ref to preserve annotated notes.
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/kelpie-release/tag"
          git for-each-ref --format='%(contents)' refs/kelpie-release/tag > notes.md
          [ -s notes.md ] || echo "Kelpie $v" > notes.md
          exe=$(ls dist/*-setup.exe | head -1)
          mac=$(ls dist/*.app.tar.gz | head -1)
          appimage=$(ls dist/*.AppImage | head -1)
          # The updater looks for linux-x86_64-<bundle> before linux-x86_64: a .deb install updates from the
          # signed .deb (pkexec dpkg -i). Without that entry it would be offered the AppImage, which it refuses
          # to install as a package (an error, never a broken install).
          deb=$(ls dist/*.deb 2>/dev/null | head -1 || true)
          extra=()
          if [ -n "$deb" ] && [ -f "$deb.sig" ]; then extra+=(--artifact "linux-x86_64-deb=$deb"); fi
          python3 scripts/release/latest_json.py --version "$v" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --artifact "windows-x86_64=$exe" \
            --artifact "darwin-aarch64=$mac" \
            --artifact "darwin-x86_64=$mac" \
            --artifact "linux-x86_64=$appimage" "${extra[@]}" > dist/latest.json
          cat dist/latest.json
      # After latest.json, so the update notes apps show stay the tag's own.
      - name: Hosted phone app manifest, bundle and hash
        shell: bash
        env:
          BUNDLE_SHA256: ${{ needs.hosted-build.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          python3 -I scripts/hosted/verify_live.py --bundle hosted/dist-phone-hosted --tag "$GITHUB_REF_NAME" \
            --manifest hosted/hosted-phone-manifest.json
          sha=$(python3 -I -c 'import json,sys;print(json.load(open(sys.argv[1]))["bundle_sha256"])' hosted/hosted-phone-manifest.json)
          [ "$sha" = "$BUNDLE_SHA256" ] || { echo "manifest $sha, build $BUNDLE_SHA256"; exit 1; }
          cp hosted/hosted-phone-manifest.json dist/
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C hosted/dist-phone-hosted -cf - . \
            | gzip -n > "dist/hosted-phone-$v.tar.gz"
          cat >> notes.md <<EOF

          ## Hosted phone app

          Served at https://kelpie-link-relay.baopeak.workers.dev. Bundle sha256: \`$sha\`
          (every file and its hash: \`hosted-phone-manifest.json\`; the bundle: \`hosted-phone-$v.tar.gz\`).
          Check what the origin serves, from a clone of this repository:

              python3 -I scripts/hosted/verify_live.py --tag $GITHUB_REF_NAME
          EOF
          ls -l dist
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Kelpie ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # Deploys: one at a time (relay.yml's room deploys share the group), each after the owner's approval in its environment.
  # The Cloudflare secrets reach only the deploy step; nothing here runs with `set -x` or prints them.
  hosted-staging:
    needs: hosted-build
    runs-on: ubuntu-22.04
    environment:
      name: hosted-staging
      url: https://kelpie-link-relay-staging.baopeak.workers.dev
    concurrency:
      group: hosted-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install relay dependencies
        working-directory: relay
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-phone
          path: ${{ runner.temp }}/hosted
      - name: The bundle is the one the manifest and the build name
        shell: bash
        env:
          BUNDLE_SHA256: ${{ needs.hosted-build.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          python3 -I scripts/hosted/verify_live.py --bundle "$RUNNER_TEMP/hosted/dist-phone-hosted" --tag "$GITHUB_REF_NAME" \
            --manifest "$RUNNER_TEMP/hosted/hosted-phone-manifest.json"
          sha=$(python3 -I -c 'import json,sys;print(json.load(open(sys.argv[1]))["bundle_sha256"])' "$RUNNER_TEMP/hosted/hosted-phone-manifest.json")
          [ "$sha" = "$BUNDLE_SHA256" ] || { echo "manifest $sha, build $BUNDLE_SHA256"; exit 1; }
          rm -rf relay/public
          cp -R "$RUNNER_TEMP/hosted/dist-phone-hosted" relay/public
      - name: Deploy the router and the app to staging
        working-directory: relay
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          BUNDLE_SHA256: ${{ needs.hosted-build.outputs.bundle_sha256 }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "the environment has no Cloudflare secrets"; exit 1; }
          pnpm exec wrangler deploy -c wrangler.toml --env=staging --message "$GITHUB_REF_NAME $BUNDLE_SHA256"
      # The edge may serve the previous version for a few seconds after a deploy.
      - name: Check what staging serves
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            python3 -I scripts/hosted/verify_live.py --env staging --tag "$GITHUB_REF_NAME" \
              --manifest "$RUNNER_TEMP/hosted/hosted-phone-manifest.json" && exit 0
            sleep 10
          done
          exit 1
      - name: Smoke test staging
        working-directory: relay
        env:
          RELAY_URL: https://kelpie-link-relay-staging.baopeak.workers.dev
          PAGE: "1"
        run: pnpm smoke

  hosted-production:
    needs: [hosted-build, publish, hosted-staging]
    runs-on: ubuntu-22.04
    environment:
      name: hosted-production
      url: https://kelpie-link-relay.baopeak.workers.dev
    concurrency:
      group: hosted-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install relay dependencies
        working-directory: relay
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-phone
          path: ${{ runner.temp }}/hosted
      - name: The bundle is the one the manifest and the build name
        shell: bash
        env:
          BUNDLE_SHA256: ${{ needs.hosted-build.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          python3 -I scripts/hosted/verify_live.py --bundle "$RUNNER_TEMP/hosted/dist-phone-hosted" --tag "$GITHUB_REF_NAME" \
            --manifest "$RUNNER_TEMP/hosted/hosted-phone-manifest.json"
          sha=$(python3 -I -c 'import json,sys;print(json.load(open(sys.argv[1]))["bundle_sha256"])' "$RUNNER_TEMP/hosted/hosted-phone-manifest.json")
          [ "$sha" = "$BUNDLE_SHA256" ] || { echo "manifest $sha, build $BUNDLE_SHA256"; exit 1; }
          rm -rf relay/public
          cp -R "$RUNNER_TEMP/hosted/dist-phone-hosted" relay/public
      - name: Deploy the router and the app to production
        working-directory: relay
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          BUNDLE_SHA256: ${{ needs.hosted-build.outputs.bundle_sha256 }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "the environment has no Cloudflare secrets"; exit 1; }
          pnpm exec wrangler deploy -c wrangler.toml --env= --message "$GITHUB_REF_NAME $BUNDLE_SHA256"
      - name: Check what production serves
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            python3 -I scripts/hosted/verify_live.py --env production --tag "$GITHUB_REF_NAME" \
              --manifest "$RUNNER_TEMP/hosted/hosted-phone-manifest.json" && exit 0
            sleep 10
          done
          exit 1
      - name: Smoke test production
        working-directory: relay
        env:
          RELAY_URL: https://kelpie-link-relay.baopeak.workers.dev
          PAGE: "1"
        run: pnpm smoke