name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-22.04"]') || fromJSON('["windows-latest","macos-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Linux: WebKitGTK, tray and SVG libraries for Tauri, D-Bus for the Secret Service keyring, ALSA for
      # the speech helper's microphone, linuxdeploy's needs for the AppImage, and the WebDriver + X server
      # the smoke test drives the app with.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf \
            libasound2-dev xdg-utils libfuse2 file \
            webkit2gtk-driver xvfb xauth dbus-x11
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      # The daemon embeds the phone client (app/dist-phone), so it is built before any cargo build or test.
      - name: Frontend typecheck, tests and phone client
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm i18n:check
          pnpm build:phone
      - name: Rust tests (protocol, daemon, app backend, speech helper, screen helper, screen peer)
        shell: bash
        env:
          KELPIE_REQUIRE_PHONE: "1"
        run: cargo test -p kelpie-proto -p kelpie-link -p kelpied -p kelpie -p kelpie-stt -p kelpie-screen -p kelpie-window -p kelpie-rtc
      - name: The phone link's crypto stays free of ring
        shell: bash
        run: |
          if cargo tree -p kelpie-link -e normal | grep -E '\bring v'; then
            echo "kelpie-link must not depend on ring"
            exit 1
          fi
      - name: A daemon cannot be built without the phone client when it is required
        shell: bash
        run: scripts/check-phone-guard.sh
      - name: Performance gate (bundle size, daemon throughput; the GUI metrics need a desktop, see scripts/perf/README.md)
        shell: bash
        run: |
          python scripts/perf/perf_gate.py --label ci-bundle --metrics bundle --runs 1 --compare scripts/perf/baseline.json
          KELPIE_REQUIRE_PHONE=1 cargo build --release -p kelpied
          python scripts/perf/perf_gate.py --label ci-bench --metrics bench --runs 1
      - name: Bundle
        shell: bash
        env:
          # linuxdeploy is itself an AppImage: run it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/build-release.sh --bundles ${{ matrix.os == 'windows-latest' && 'nsis' || matrix.os == 'macos-latest' && 'app,dmg' || 'appimage,deb' }}
      - name: Linux packages install cleanly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls target/release/bundle/deb/*.deb | head -1)
          img=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee deb-contents.txt
          # dpkg-deb lists paths with or without a leading "./" depending on how the archive was built.
          for f in usr/bin/kelpie usr/bin/kelpied usr/bin/kelpie-stt usr/share/applications/Kelpie.desktop; do
            grep -Eq " (\./)?$f\$" deb-contents.txt || { echo "missing from the .deb: $f"; exit 1; }
          done
          sudo dpkg -i "$deb" || { sudo apt-get install -f -y && sudo dpkg -i "$deb"; }
          dpkg -s kelpie | grep -q '^Status: install ok installed'
          # Every shared library the installed programs need resolves.
          for f in /usr/bin/kelpie /usr/bin/kelpied /usr/bin/kelpie-stt; do
            test -x "$f" || { echo "not installed: $f"; exit 1; }
            if ldd "$f" | grep 'not found'; then echo "$f misses libraries"; exit 1; fi
          done
          sudo dpkg -r kelpie
          test -x "$img" || { echo "$img is not executable"; exit 1; }
          file "$img" | grep -q ELF
          mkdir -p appimage-check && cd appimage-check
          "../$img" --appimage-extract >/dev/null
          for f in squashfs-root/usr/bin/kelpie squashfs-root/usr/bin/kelpied squashfs-root/usr/bin/kelpie-stt; do
            test -x "$f" || { echo "missing from the AppImage: $f"; exit 1; }
          done
          cd .. && rm -rf appimage-check
      - name: Linux smoke under Xvfb (isolated daemon, release app)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        env:
          # No GPU under Xvfb: WebKitGTK's DMA-BUF renderer and compositing can leave the window blank there.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          # WebKit's process, inspector (the WebDriver's link to the app) and IPC logs land in the driver log: a run that
          # loses its WebDriver connection then says which side went away.
          WEBKIT_DEBUG: "Process,Inspector,IPC"
        run: |
          set -euo pipefail
          # A crash of the app, its web process or the driver leaves a core for the step after a failure.
          ulimit -c unlimited
          sudo mkdir -p /var/tmp/cores && sudo chmod 1777 /var/tmp/cores
          sudo sysctl -q -w kernel.core_pattern=/var/tmp/cores/core.%e.%p
          cargo install tauri-driver --locked
          python -m pip install psutil
          mkdir -p smoke
          # Cold start and idle numbers are recorded (artifact `linux-smoke`) and shown next to the Linux
          # baseline once one is committed; they are not gated yet.
          baseline=()
          if [ -f scripts/perf/linux-smoke-baseline.json ]; then baseline=(--baseline scripts/perf/linux-smoke-baseline.json); fi
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" \
            python scripts/e2e/boot_smoke.py smoke target/release/kelpie \
              --out smoke/linux-smoke.json "${baseline[@]}"
      - name: Linux smoke repeats (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        timeout-minutes: 30
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DEBUG: "Process,Inspector,IPC"
        run: |
          ulimit -c unlimited
          fails=0
          for i in $(seq 1 12); do
            dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" \
              python scripts/e2e/boot_smoke.py "smoke/rep-$i" target/release/kelpie --idle 2 --out "smoke/rep-$i/result.json" \
              || { fails=$((fails+1)); echo "::warning::repeat $i failed"; }
          done
          echo "repeats failed: $fails of 12"
          test "$fails" -eq 0
      - name: Linux smoke crash evidence (on failure)
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p smoke
          sudo dmesg -T | tail -n 300 > smoke/dmesg.txt || true
          ls -la /var/tmp/cores > smoke/cores.txt 2>&1 || true
          if compgen -G "/var/tmp/cores/core.*" > /dev/null; then
            sudo apt-get install -y --no-install-recommends gdb > /dev/null
            for c in /var/tmp/cores/core.*; do
              exe=$(sudo file "$c" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
              sudo gdb -batch -nx -ex "info threads" -ex "thread apply all bt" "$exe" "$c" > "smoke/bt-$(basename "$c").txt" 2>&1 || true
            done
          fi
      # Not gating yet: it shows how often a boot check through the window helper passes on this runner, where a WebDriver session
      # with the app could not be opened (0 of 10 boot smokes in the trial of 2026-11-22).
      - name: Windows boot check through the window helper (isolated daemon, release app)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p kelpie-window
          mkdir -p window-boot
          python scripts/e2e/window_boot.py window-boot target/release/kelpie.exe target/release/kelpie-window.exe --owed --out window-boot/window-boot.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-window-boot
          path: |
            window-boot/*.json
            window-boot/*.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: kelpie-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: linux-smoke
          path: smoke/
          if-no-files-found: ignore
          retention-days: 3
