name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust tests (protocol, daemon, app backend, speech helper)
        run: cargo test -p kelpie-proto -p kelpied -p kelpie -p kelpie-stt
      - name: Frontend typecheck
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm i18n:check
      - name: Performance gate (bundle size, daemon throughput; the GUI metrics need a desktop, see scripts/perf/README.md)
        shell: bash
        run: |
          python scripts/perf/perf_gate.py --label ci-bundle --metrics bundle --runs 1 --compare scripts/perf/baseline.json
          cargo build --release -p kelpied
          python scripts/perf/perf_gate.py --label ci-bench --metrics bench --runs 1
      - name: Bundle
        shell: bash
        run: scripts/build-release.sh --bundles ${{ matrix.os == 'windows-latest' && 'nsis' || 'app,dmg' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kelpie-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
